services:
  db:
    image: postgres:15-alpine
    container_name: postgres_estacionamientos
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Lima
    # MEJORA #29: Puerto 5432 NO expuesto al host (solo red interna Docker)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - estacionamientos_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # MEJORA #25: LÃ­mites de recursos
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    # MEJORA #30: Logging controlado para evitar llenado de disco
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  usuarios:
    build: ./backends/usuarios
    container_name: servicio_usuarios
    restart: always
    ports:
      - "8001:8001"
    environment:
      - TZ=America/Lima
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SCHEMA_NAME=db_usuarios
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - ADMIN_NOMBRE=${ADMIN_NOMBRE:-Admin Global}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@smartpark.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - PAGOS_SERVICE_URL=http://pagos:8004
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
    networks:
      - estacionamientos_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # MEJORA #25: LÃ­mites de recursos
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    # MEJORA #30: Logging controlado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  estacionamientos:
    build: ./backends/estacionamientos
    container_name: servicio_estacionamientos
    restart: always
    ports:
      - "8002:8002"
    environment:
      - TZ=America/Lima
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SCHEMA_NAME=db_estacionamientos
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - USUARIOS_SERVICE_URL=http://usuarios:8001
      - PAGOS_SERVICE_URL=http://pagos:8004
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
    networks:
      - estacionamientos_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # MEJORA #25: LÃ­mites de recursos
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    # MEJORA #30: Logging controlado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  reservas:
    build: ./backends/reservas
    container_name: servicio_reservas
    restart: always
    ports:
      - "8003:8003"
    environment:
      - TZ=America/Lima
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SCHEMA_NAME=db_reservas
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - ESTACIONAMIENTOS_SERVICE_URL=http://estacionamientos:8002
      - PAGOS_SERVICE_URL=http://pagos:8004
      - USUARIOS_SERVICE_URL=http://usuarios:8001
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
      estacionamientos:
        condition: service_healthy
      pagos:
        condition: service_healthy
    networks:
      - estacionamientos_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # MEJORA #25: LÃ­mites de recursos
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    # MEJORA #30: Logging controlado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pagos:
    build: ./backends/pagos
    container_name: servicio_pagos
    restart: always
    ports:
      - "8004:8004"
    environment:
      - TZ=America/Lima
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SCHEMA_NAME=db_pagos
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - CULQI_PUBLIC_KEY=${CULQI_PUBLIC_KEY}
      - CULQI_SECRET_KEY=${CULQI_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - RESERVAS_SERVICE_URL=http://reservas:8003
      - USUARIOS_SERVICE_URL=http://usuarios:8001
      - ESTACIONAMIENTOS_SERVICE_URL=http://estacionamientos:8002
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
    networks:
      - estacionamientos_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # MEJORA #25: LÃ­mites de recursos
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    # MEJORA #30: Logging controlado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: frontend_estacionamientos
    restart: always
    ports:
      - "8080:80"
    environment:
      - TZ=America/Lima
    depends_on:
      usuarios:
        condition: service_healthy
      estacionamientos:
        condition: service_healthy
      reservas:
        condition: service_healthy
      pagos:
        condition: service_healthy
    networks:
      - estacionamientos_net
    # MEJORA #25: LÃ­mites de recursos
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    # MEJORA #30: Logging controlado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend-vue:
    build: ./frontend-vue
    container_name: frontend_vue_estacionamientos
    restart: always
    ports:
      - "8081:80"
    environment:
      - TZ=America/Lima
    depends_on:
      usuarios:
        condition: service_healthy
      estacionamientos:
        condition: service_healthy
      reservas:
        condition: service_healthy
      pagos:
        condition: service_healthy
    networks:
      - estacionamientos_net

networks:
  estacionamientos_net:
    driver: bridge

volumes:
  postgres_data:

