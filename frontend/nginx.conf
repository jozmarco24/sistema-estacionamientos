server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index login.html;
        try_files $uri $uri.html $uri/ /login.html;
    }

    # Reverse proxy para evitar CORS y peticiones a puertos dispersos
    location /api/usuarios/ {
        proxy_pass http://usuarios:8001/usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/estacionamientos/ {
        proxy_pass http://estacionamientos:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Si el frontend llama a /api/reservas/reservas/
    location /api/reservas/reservas/ {
        proxy_pass http://reservas:8003/reservas/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Si el frontend llama a /api/reservas/
    location /api/reservas/ {
        proxy_pass http://reservas:8003/reservas/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Si el frontend llama a /api/pagos/pagos/
    location /api/pagos/pagos/ {
        proxy_pass http://pagos:8004/pagos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Location para pagos-service (permite /api/pagos/credenciales/ y /api/pagos/pagos/)
    location /api/pagos/ {
        proxy_pass http://pagos:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

